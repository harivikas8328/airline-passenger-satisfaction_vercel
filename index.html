<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Passenger Predictor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f6;
            color: #31333F;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; color: #ff4b4b; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label { font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        select, input[type="range"] {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .slider-value {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.2rem;
            text-align: right;
        }
        button {
            background-color: #ff4b4b;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #ff3333; }
        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 4px;
            font-weight: bold;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h1>✈️ Quick Passenger Predictor</h1>
        <p>A lightweight model using the top 8 predictive features.</p>
        
        <form id="predictionForm">
            <h3>Flight Info</h3>
            <div class="grid">
                <div class="form-group">
                    <label>Customer Type</label>
                    <select id="Customer_Type">
                        <option value="Loyal Customer">Loyal Customer</option>
                        <option value="disloyal Customer">Disloyal Customer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Type of Travel</label>
                    <select id="Type_of_Travel">
                        <option value="Personal Travel">Personal Travel</option>
                        <option value="Business travel">Business travel</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Class</label>
                    <select id="Class">
                        <option value="Eco">Eco</option>
                        <option value="Eco Plus">Eco Plus</option>
                        <option value="Business">Business</option>
                    </select>
                </div>
            </div>

            <h3>Service Ratings (0-5)</h3>
            <div class="grid">
                <div class="form-group">
                    <label>Inflight wifi service</label>
                    <input type="range" id="Inflight_wifi_service" min="0" max="5" value="3" oninput="updateVal(this)">
                    <div class="slider-value" id="val-Inflight_wifi_service">3</div>
                </div>
                <div class="form-group">
                    <label>Online boarding</label>
                    <input type="range" id="Online_boarding" min="0" max="5" value="3" oninput="updateVal(this)">
                    <div class="slider-value" id="val-Online_boarding">3</div>
                </div>
                <div class="form-group">
                    <label>Inflight entertainment</label>
                    <input type="range" id="Inflight_entertainment" min="0" max="5" value="3" oninput="updateVal(this)">
                    <div class="slider-value" id="val-Inflight_entertainment">3</div>
                </div>
                <div class="form-group">
                    <label>Seat comfort</label>
                    <input type="range" id="Seat_comfort" min="0" max="5" value="3" oninput="updateVal(this)">
                    <div class="slider-value" id="val-Seat_comfort">3</div>
                </div>
                <div class="form-group">
                    <label>Leg room service</label>
                    <input type="range" id="Leg_room_service" min="0" max="5" value="3" oninput="updateVal(this)">
                    <div class="slider-value" id="val-Leg_room_service">3</div>
                </div>
            </div>

            <button type="submit" id="submitBtn">Predict Satisfaction</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        // Update slider display values dynamically
        function updateVal(slider) {
            document.getElementById('val-' + slider.id).innerText = slider.value;
        }

        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            
            // Gather form data
            const payload = {
                Type_of_Travel: document.getElementById('Type_of_Travel').value,
                Class: document.getElementById('Class').value,
                Customer_Type: document.getElementById('Customer_Type').value,
                Inflight_wifi_service: parseInt(document.getElementById('Inflight_wifi_service').value),
                Online_boarding: parseInt(document.getElementById('Online_boarding').value),
                Inflight_entertainment: parseInt(document.getElementById('Inflight_entertainment').value),
                Seat_comfort: parseInt(document.getElementById('Seat_comfort').value),
                Leg_room_service: parseInt(document.getElementById('Leg_room_service').value)
            };

            // Update UI state
            submitBtn.disabled = true;
            submitBtn.innerText = "Analyzing...";
            resultDiv.style.display = 'none';
            resultDiv.className = '';

            try {
                // Since front and back are on the same server, we can just call /predict
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('API request failed');
                
                const data = await response.json();
                
                resultDiv.style.display = 'block';
                if (data.prediction === "satisfied") {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = "Result: The passenger is Satisfied! 🎉";
                } else {
                    resultDiv.className = 'warning';
                    resultDiv.innerHTML = `Result: The passenger is ${data.prediction}. 😞`;
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'error';
                resultDiv.innerHTML = "An error occurred while analyzing data.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Predict Satisfaction";
            }
        });
    </script>
</body>
</html>
